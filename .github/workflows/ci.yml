name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `svelte-kit sync` generates ./$types; without it every route file fails to resolve.
      - run: npx svelte-kit sync

      - name: Formatting
        run: npx prettier --check .

      # The unit tests. The browser project needs a real Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm run test

      # Type and lint errors are ratcheted rather than gated at zero — see the script.
      - name: Type and lint budget
        run: node scripts/check-budget.mjs
